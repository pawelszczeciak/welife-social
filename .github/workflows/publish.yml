# Co 10 minut publikuje posty z queue/, których czas minął.
# Na żywo tylko przy zmiennej repo PUBLISH_LIVE=true; inaczej tryb próbny (log, bez wysyłki).
name: Publikacja

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Publikuj należne posty
        env:
          PUBLISH_LIVE: ${{ vars.PUBLISH_LIVE }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_TIKTOK_ACCOUNT_ID: ${{ secrets.ZERNIO_TIKTOK_ACCOUNT_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_VAULT_KEY: ${{ secrets.TIKTOK_VAULT_KEY }}
        run: node scripts/publish.mjs
      - name: Zapisz stan publikacji
        if: always()
        run: |
          if [ -n "$(git status --porcelain state vault)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state vault
            git commit -m "Stan publikacji"
            git pull --rebase
            git push
          fi
